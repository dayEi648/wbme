# WBME monorepo workspaces：apps 为部署单元与前端，packages 为 @wbme 共享包
packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  archiver: 5.3.2
ignoredBuiltDependencies:
  - '@scarf/scarf'
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@prisma/client': true
  esbuild: true
  '@scarf/scarf': false
  msgpackr-extract: true
  sharp: true
minimumReleaseAgeExclude:
  - eslint@10.8.1
