# 合并门禁 CI：push main 与 PR 时执行质量检查。
# 依赖安装统一走国内镜像（npmmirror），与开发机网络环境保持一致。
# 引用的聚合脚本（lint/typecheck/test/build）在工程基座阶段于根 package.json 定义。
# 后续扩展（工程基座就绪后追加）：
#   - Prisma 迁移可执行性校验（临时 PostgreSQL 上 migrate deploy，覆盖 4 套迁移序列）
#   - Playwright E2E（测试环境稳定后）
#   - 镜像构建（发布流程纳入后）

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Redis 集成测试(启动探测/健康探针/命名空间)依赖真实 Redis
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为唯一来源
      # （与 action-setup 的 version 键同时存在会报 Multiple versions of pnpm specified）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm prisma:generate

      # 共享包先构建:typecheck/test 依赖各包的 dist(.d.ts),全新环境必须先出产物
      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # Redis 集成测试(启动探测/健康探针/命名空间)依赖真实 Redis
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build
