# 合并门禁 CI：push main 与 PR 时执行质量检查。
# 依赖安装统一走国内镜像（npmmirror），与开发机网络环境保持一致。
# 引用的聚合脚本（lint/typecheck/test/build）在根 package.json 定义。
# 集成测试依赖真实 PostgreSQL（4 套迁移序列执行）+ Redis；E2E 见下方 e2e job；
# 镜像构建由 deploy/release.sh 在发布时执行，不进入 CI。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # 集成测试（认证链路/激活/审批等真实数据库用例）依赖临时 PostgreSQL
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis 集成测试(启动探测/健康探针/命名空间/登录保护)依赖真实 Redis
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为唯一来源
      # （与 action-setup 的 version 键同时存在会报 Multiple versions of pnpm specified）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prisma.config.ts 解析 datasource.url 时要求 DATABASE_URL 存在（env() 缺失即抛错）。
      # prisma generate 不连接数据库，CI 使用占位连接串即可；迁移/运行时由部署环境注入真实值。
      - name: Generate Prisma clients
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # 共享包先构建:typecheck/test 依赖各包的 dist(.d.ts),全新环境必须先出产物
      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Migration Runner 的 start 直接运行 dist 产物（build:packages 只构建 ./packages/**），
      # 迁移步骤前必须先构建，否则 MODULE_NOT_FOUND 导致 CI 失败
      - name: Build migration runner
        run: pnpm --filter @wbme/migration-runner build

      # 在 CI PostgreSQL 上执行 4 套迁移序列与只读视图脚本（集成测试前置）
      - name: Run migrations on CI database
        run: pnpm --filter @wbme/migration-runner start
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wbme

      - name: Test
        run: pnpm test
        env:
          # 集成测试（认证链路/激活/审批等真实数据库用例）连接 CI PostgreSQL
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wbme
          # Redis 集成测试(启动探测/健康探针/命名空间/登录保护)依赖真实 Redis
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build

      # OpenAPI 产物防漂移（主 PRD §9.5）：重新生成并与提交文件比对；生成全程离线（不依赖 CI 数据库/Redis）
      # 四个部署单元全覆盖：platform-core / hr / asset / fin
      - name: Verify OpenAPI artifacts
        run: |
          pnpm --filter @wbme/platform-core openapi:verify
          pnpm --filter @wbme/hr openapi:verify
          pnpm --filter @wbme/asset openapi:verify
          pnpm --filter @wbme/fin openapi:verify

      # 生产 Compose 展开校验（主 PRD §9.12：提交前 docker compose config 校验展开结果；
      # 本期只校验配置，不执行实际部署）
      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config -q
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/wbme
          POSTGRES_PASSWORD: ci
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          COOKIE_SIGNING_KEY: ci-cookie-signing-key-32-characters
          RECOVERY_SESSION_SECRET: ci-recovery-session-secret-32
          PUBLIC_ORIGIN: http://ci.local

  # E2E：认证/门户/核心业务链路。复用 quality job 的 PostgreSQL/Redis 服务，
  # 后端四服务与前端由 Playwright webServer 自动拉起（reuseExistingServer 本地复用）。
  e2e:
    name: E2E（认证/门户/核心链路）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wbme
      REDIS_URL: redis://localhost:6379
      INTERNAL_SERVICE_TOKEN: ci-internal-token-32-characters-!
      COOKIE_SIGNING_KEY: ci-cookie-signing-key-32-characters
      # HTTP E2E：Secure Cookie 在 Playwright page.request 访问 127.0.0.1 时会被丢弃（localhost 例外），
      # 导致 API 直连缺会话 Cookie → 401；与本地 .env.example 对齐关闭 Secure。
      COOKIE_SECURE: 'false'
      PUBLIC_ORIGIN: http://127.0.0.1:45173
      DINGTALK_CORP_ID: ci
      DINGTALK_APP_KEY: ci
      DINGTALK_APP_SECRET: ci
      DINGTALK_REDIRECT_URI: http://127.0.0.1:45173/api/v1/auth/dingtalk/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm prisma:generate

      - name: Build shared packages and apps
        run: pnpm -r build

      - name: Run migrations on CI database
        run: pnpm --filter @wbme/migration-runner start

      # e2e-seed.mjs 位于仓库根 scripts/，且内部经 createRequire 按仓库根解析
      # platform-core(@node-rs/argon2) 与 migration-runner(pg) 的依赖，
      # 必须在仓库根执行（--filter 会把工作目录切到包目录导致脚本找不到）
      - name: Seed E2E test user
        run: node scripts/e2e-seed.mjs

      - name: Install Playwright browsers
        run: pnpm --filter @wbme/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @wbme/web e2e
