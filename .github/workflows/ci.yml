# 合并门禁 CI：push main 与 PR 时执行质量检查。
# 依赖安装统一走国内镜像（npmmirror），与开发机网络环境保持一致。
# 引用的聚合脚本（lint/typecheck/test/build）在工程基座阶段于根 package.json 定义。
# 集成测试依赖真实 PostgreSQL（4 套迁移序列执行）+ Redis。
# 后续扩展：Playwright E2E（测试环境稳定后）、镜像构建（发布流程纳入后）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # 集成测试（认证链路/激活/审批等真实数据库用例）依赖临时 PostgreSQL
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis 集成测试(启动探测/健康探针/命名空间/登录保护)依赖真实 Redis
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为唯一来源
      # （与 action-setup 的 version 键同时存在会报 Multiple versions of pnpm specified）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prisma.config.ts 解析 datasource.url 时要求 DATABASE_URL 存在（env() 缺失即抛错）。
      # prisma generate 不连接数据库，CI 使用占位连接串即可；迁移/运行时由部署环境注入真实值。
      - name: Generate Prisma clients
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # 共享包先构建:typecheck/test 依赖各包的 dist(.d.ts),全新环境必须先出产物
      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 在 CI PostgreSQL 上执行 4 套迁移序列与只读视图脚本（集成测试前置）
      - name: Run migrations on CI database
        run: pnpm --filter @wbme/migration-runner start
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wbme

      - name: Test
        run: pnpm test
        env:
          # 集成测试（认证链路/激活/审批等真实数据库用例）连接 CI PostgreSQL
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wbme
          # Redis 集成测试(启动探测/健康探针/命名空间/登录保护)依赖真实 Redis
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build
