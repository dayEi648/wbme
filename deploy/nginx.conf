# WBME Nginx 统一入口（主 PRD §9.14 / §13；浏览器公开网关前缀见 docs/api-documentations/README.md）。
# 规则：
#   - 静态前端 + SPA fallback；
#   - 浏览器公开前缀反代各业务容器（容器内统一 /api/v1）；/internal/v1 永不配置路由（公网不可达）；
#   - 健康探针只经本入口返回最小状态，不直通容器管理端口；
#   - 上传上限 25 MiB（fin 导入 20 MiB + 余量）；SSE 反代关闭缓冲（主 PRD §13）；
#   - HTTPS（主 PRD §9.14）：80 仅保留健康探针直答，其余 308 跳转 HTTPS（保留请求方法）；
#     443 承载全部业务，证书经 compose 只读挂载到 /etc/nginx/certs/（部署前放置）。

# 恢复控制通道上游（backstage PRD §10）：静态 proxy_pass 必须引用 upstream/字面地址。
# 不能用「set $var + proxy_pass $var」的变量形式——变量形式在请求期解析域名，
# 无 resolver 指令时 nginx 报 "no resolver defined to resolve recovery-executor" → 502
# （nginx -t 查不出）；upstream 的 server 域名在配置加载期解析，无此问题。
upstream recovery_executor_backend {
    server recovery-executor:43090;
}

# ---- HTTP server：健康探针直答 + 其余跳转 HTTPS ----
server {
    listen 80;
    server_name _;

    # 健康探针（免登录最小状态；Docker/发布编排经 HTTP 探针，不跳转不引入维护检查）
    location = /healthz {
        proxy_pass http://platform-core:43001/healthz;
    }
    location = /readyz {
        proxy_pass http://platform-core:43001/readyz;
    }

    # 其余 HTTP 统一 308 跳转 HTTPS（保留方法：POST 登录不被转成 GET）
    location / {
        return 308 https://$host$request_uri;
    }
}

# ---- HTTPS server：完整业务入口（唯一公网业务通道）----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 恢复控制通道（backstage PRD §10 第 129 行）：标记文件由恢复执行器维护，
    # web 以只读 bind mount 访问（Dockerfile 已降权 nginx 至 wbme uid）。
    # 维护标记存在与否在 /recovery/ location 内判定（见下方）。

    # 静态前端
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小上限（fin Excel 导入 20 MiB + 余量）
    client_max_body_size 25m;

    # 统一安全响应头（主 PRD §9.7 Web 安全基线）
    # CSP：钉钉 OAuth 为整页导航不触发 CSP；OSS 预签名图片为 https 直连
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 网关公共前缀（与 docs/api-documentations/README.md「浏览器公开网关路径」一致）
    # platform-core（base + backstage）
    location /api/v1/ {
        error_page 503 = @maintenance_api;
        include /etc/nginx/maintenance.conf;
        proxy_pass http://platform-core:43001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # asset（容器内 /api/v1）
    location /api/asset/v1/ {
        error_page 503 = @maintenance_api;
        include /etc/nginx/maintenance.conf;
        rewrite ^/api/asset/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://asset:43002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # hr（容器内 /api/v1）
    location /api/hr/v1/ {
        error_page 503 = @maintenance_api;
        include /etc/nginx/maintenance.conf;
        rewrite ^/api/hr/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://hr:43003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # fin（容器内 /api/v1；Excel 导入导出长任务 120s 超时）
    location /api/fin/v1/ {
        error_page 503 = @maintenance_api;
        include /etc/nginx/maintenance.conf;
        rewrite ^/api/fin/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://fin:43004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # 健康探针（免登录最小状态；经 Nginx 返回，不直通容器端口）
    location = /healthz {
        proxy_pass http://platform-core:43001/healthz;
    }
    location = /readyz {
        proxy_pass http://platform-core:43001/readyz;
    }

    # 恢复控制通道（backstage PRD §10 第 129-130 行）：维护状态下浏览器可达
    # /recovery/status（查询）与 /recovery/retry（确认/重试），携带恢复控制会话
    # Cookie（Path=/recovery，由超管经 POST /api/v1/restores/session 签发）操作；
    # 非维护状态一律 404，平时不可达。
    location /recovery/ {
        # if 内仅 return，属安全用法（不使用变量 proxy_pass，避免请求期域名解析）
        if (!-f /opt/wbme/persist/restore-state/maintenance.marker) {
            return 404;
        }
        proxy_pass http://recovery_executor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # 其它 /api 前缀（含 /internal/v1、未注册前缀）一律不路由 → 404（内部 REST 不暴露公网）
    location /api/ {
        error_page 503 = @maintenance_api;
        include /etc/nginx/maintenance.conf;
        return 404;
    }

    # L34：/internal/*（服务间内部 REST）不经公网；此前 /internal/v1 未匹配任何
    # location 会落入下方 SPA fallback 返回 200 index.html，掩盖内部路由不可达；
    # SPA fallback 之前显式 404。
    location ~ ^/internal/ {
        return 404;
    }

    # SPA fallback（前端路由由 React Router 处理；后端 API 与探针已在上方精确匹配）
    location / {
        error_page 503 = @maintenance_page;
        include /etc/nginx/maintenance.conf;
        try_files $uri /index.html;
    }

    # 维护状态响应：API 保持统一错误码，页面请求提供最小维护提示；健康探针位于上方，
    # 不引入维护检查，供 Docker/发布编排持续观测。
    location @maintenance_api {
        internal;
        default_type application/json;
        add_header Retry-After "60" always;
        return 503 '{"error":{"code":"SYSTEM_MAINTENANCE","type":"DEPENDENCY","message":"系统维护中，请稍后再试"}}';
    }

    location @maintenance_page {
        internal;
        default_type text/html;
        add_header Retry-After "60" always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>系统维护中</title><body><h1>系统维护中</h1><p>请稍后再试。</p></body></html>';
    }
}
