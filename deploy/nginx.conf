# WBME Nginx 统一入口（主 PRD §9.14 / §13；浏览器公开网关前缀见 docs/api-documentations/README.md）。
# 规则：
#   - 静态前端 + SPA fallback；
#   - 浏览器公开前缀反代各业务容器（容器内统一 /api/v1）；/internal/v1 永不配置路由（公网不可达）；
#   - 健康探针只经本入口返回最小状态，不直通容器管理端口；
#   - 上传上限 25 MiB（fin 导入 20 MiB + 余量）；SSE 反代关闭缓冲（主 PRD §13）。
# HTTPS 上线：申请证书后新增 443 server 并签发跳转，本 server 仅保留 rewrite 跳转（主 PRD §9.14）。

server {
    listen 80;
    server_name _;

    # 静态前端
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小上限（fin Excel 导入 20 MiB + 余量）
    client_max_body_size 25m;

    # 统一安全响应头（主 PRD §9.7 Web 安全基线）
    # CSP：钉钉 OAuth 为整页导航不触发 CSP；OSS 预签名图片为 https 直连
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 网关公共前缀（与 docs/api-documentations/README.md「浏览器公开网关路径」一致）
    # platform-core（base + backstage）
    location /api/v1/ {
        proxy_pass http://platform-core:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # asset（容器内 /api/v1）
    location /api/asset/v1/ {
        rewrite ^/api/asset/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://asset:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # hr（容器内 /api/v1）
    location /api/hr/v1/ {
        rewrite ^/api/hr/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://hr:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # fin（容器内 /api/v1；Excel 导入导出长任务 120s 超时）
    location /api/fin/v1/ {
        rewrite ^/api/fin/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://fin:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 170s;
    }

    # 健康探针（免登录最小状态；经 Nginx 返回，不直通容器端口）
    location = /healthz {
        proxy_pass http://platform-core:3001/healthz;
    }
    location = /readyz {
        proxy_pass http://platform-core:3001/readyz;
    }

    # 其它 /api 前缀（含 /internal/v1、未注册前缀）一律不路由 → 404（内部 REST 不暴露公网）
    location /api/ {
        return 404;
    }

    # L34：/internal/*（服务间内部 REST）与 /recovery/*（恢复执行器控制通道）也不经公网；
    # 此前 /internal/v1 未匹配任何 location 会落入下方 SPA fallback 返回 200 index.html，
    # 掩盖内部路由不可达；SPA fallback 之前显式 404。
    # 恢复人工介入通道（backstage PRD §10）为运维链路：停止服务后由运维直连
    # 127.0.0.1:3090/recovery/*（或经恢复专用控制会话），不配置 Nginx 反向代理。
    location ~ ^/(internal|recovery)/ {
        return 404;
    }

    # SPA fallback（前端路由由 React Router 处理；后端 API 与探针已在上方精确匹配）
    location / {
        try_files $uri /index.html;
    }
}
